[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-optimization-milp"
version = "1.0.0"
description = "MILP optimizer for scheduling energy assets (batteries, generators, loads) across demand-response programs"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Makarenko" }]
keywords = ["milp", "optimization", "energy", "pyomo", "scheduling", "demand-response"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "pyomo>=6.7.0",
    "highspy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.100",
    "ruff>=0.4.0",
    "mypy>=1.11",
]

[project.scripts]
energy-optimizer = "energy_optimizer.cli:main"

[tool.setuptools.packages.find]
include = ["energy_optimizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for complete workflows",
    "edge_case: Edge case and error handling tests",
    "slow: Tests that take longer to run",
]

[tool.coverage.run]
source = ["energy_optimizer"]

[tool.coverage.report]
precision = 2
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# JSON-like test fixtures read better on one line per record
"tests/*" = ["E501"]

[tool.mypy]
# Newest mypy cannot target 3.9; 3.10 shares the same annotation syntax we use
python_version = "3.10"
ignore_missing_imports = true
